<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg{fill:#F7F7F3}
      .black{fill:#0B0D0F}
      .dark{fill:#14171A}
      .orange{fill:#FF5A1F}
      .muted{fill:#5D6368}
      .line{stroke:#D8DAD7;stroke-width:2}
      .thin-orange{stroke:#FF5A1F;stroke-width:2}
      .title{font-family:Inter,Arial,sans-serif;font-weight:800}
      .body{font-family:Inter,Arial,sans-serif;font-weight:400}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:700;letter-spacing:3px}
      .smallcaps{font-family:Inter,Arial,sans-serif;font-weight:700;letter-spacing:1.5px}
      .card{fill:#FFFFFF;stroke:#E5E6E3;stroke-width:1}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" class="bg"/>

  <!-- ================= MAIN LOGO ================= -->
  <g id="main-logo" transform="translate(85,130)">
    <!-- Symbol -->
    <g id="symbol-main" transform="translate(0,0)">
      <!-- C -->
      <path class="black" d="M190 0
        C86 0 18 70 18 165
        C18 260 86 330 190 330
        L190 270
        C124 270 79 226 79 165
        C79 104 124 60 190 60
        Z"/>
      <!-- White opening -->
      <path fill="#F7F7F3" d="M189 88
        C139 88 105 119 105 165
        C105 211 139 242 189 242
        L189 206
        C161 206 143 188 143 165
        C143 142 161 124 189 124 Z"/>
      <!-- Arrow -->
      <path class="black" d="M105 145 H190 L161 116 L183 94 L250 165 L183 236 L161 214 L190 185 H105 Z"/>
      <!-- K -->
      <path class="orange" d="M222 0 H300 L207 117 L250 161 L208 204 L300 330 H220 L160 248 L205 205 L160 160 L205 116 L160 72 Z"/>
    </g>

    <!-- Divider -->
    <line x1="360" y1="38" x2="360" y2="292" class="thin-orange"/>

    <!-- Wordmark -->
    <text x="410" y="155" font-size="92" class="title black">Clic</text>
    <text x="612" y="155" font-size="92" class="title orange">Konversion</text>
    <text x="412" y="224" font-size="28" class="caps black">STRATEGY</text>
    <circle cx="612" cy="216" r="4" class="orange"/>
    <text x="634" y="224" font-size="28" class="caps black">TECHNOLOGY</text>
    <circle cx="908" cy="216" r="4" class="orange"/>
    <text x="930" y="224" font-size="28" class="caps black">GROWTH</text>
    <circle cx="1076" cy="216" r="4" class="orange"/>
  </g>

  <!-- Divider -->
  <line x1="70" y1="480" x2="1530" y2="480" class="line"/>

  <!-- Section headers -->
  <text x="70" y="530" font-size="18" class="smallcaps orange">1.</text>
  <text x="98" y="530" font-size="18" class="smallcaps black">FULL LOGO (SYMBOL + WORDMARK)</text>

  <text x="650" y="530" font-size="18" class="smallcaps orange">2.</text>
  <text x="678" y="530" font-size="18" class="smallcaps black">SYMBOL ONLY</text>

  <text x="1015" y="530" font-size="18" class="smallcaps orange">3.</text>
  <text x="1043" y="530" font-size="18" class="smallcaps black">MOCKUP VARIATIONS</text>

  <!-- Vertical separators -->
  <line x1="600" y1="505" x2="600" y2="900" class="line"/>
  <line x1="965" y1="505" x2="965" y2="900" class="line"/>

  <!-- ================= FULL LOGO CARD ================= -->
  <g id="full-logo-card" transform="translate(70,575)">
    <rect width="480" height="300" rx="22" class="card" filter="url(#shadow)"/>
    <g transform="translate(140,35) scale(.72)">
      <path class="black" d="M190 0 C86 0 18 70 18 165 C18 260 86 330 190 330 L190 270 C124 270 79 226 79 165 C79 104 124 60 190 60 Z"/>
      <path fill="#FFFFFF" d="M189 88 C139 88 105 119 105 165 C105 211 139 242 189 242 L189 206 C161 206 143 188 143 165 C143 142 161 124 189 124 Z"/>
      <path class="black" d="M105 145 H190 L161 116 L183 94 L250 165 L183 236 L161 214 L190 185 H105 Z"/>
      <path class="orange" d="M222 0 H300 L207 117 L250 161 L208 204 L300 330 H220 L160 248 L205 205 L160 160 L205 116 L160 72 Z"/>
    </g>
    <text x="42" y="235" font-size="48" class="title black">Clic</text>
    <text x="142" y="235" font-size="48" class="title orange">Konversion</text>
    <text x="44" y="272" font-size="14" class="caps black">STRATEGY</text>
    <circle cx="146" cy="267" r="2.5" class="orange"/>
    <text x="158" y="272" font-size="14" class="caps black">TECHNOLOGY</text>
    <circle cx="294" cy="267" r="2.5" class="orange"/>
    <text x="306" y="272" font-size="14" class="caps black">GROWTH</text>
    <circle cx="374" cy="267" r="2.5" class="orange"/>
  </g>

  <!-- ================= SYMBOL CARD ================= -->
  <g id="symbol-card" transform="translate(665,610)">
    <rect width="255" height="255" rx="40" class="card" filter="url(#shadow)"/>
    <g transform="translate(38,35) scale(.60)">
      <path class="black" d="M190 0 C86 0 18 70 18 165 C18 260 86 330 190 330 L190 270 C124 270 79 226 79 165 C79 104 124 60 190 60 Z"/>
      <path fill="#FFFFFF" d="M189 88 C139 88 105 119 105 165 C105 211 139 242 189 242 L189 206 C161 206 143 188 143 165 C143 142 161 124 189 124 Z"/>
      <path class="black" d="M105 145 H190 L161 116 L183 94 L250 165 L183 236 L161 214 L190 185 H105 Z"/>
      <path class="orange" d="M222 0 H300 L207 117 L250 161 L208 204 L300 330 H220 L160 248 L205 205 L160 160 L205 116 L160 72 Z"/>
    </g>
  </g>

  <!-- ================= MOCKUPS ================= -->
  <g id="mockups" transform="translate(1000,575)">
    <!-- Light -->
    <rect width="500" height="140" rx="18" class="card" filter="url(#shadow)"/>
    <g transform="translate(24,18) scale(.31)">
      <path class="black" d="M190 0 C86 0 18 70 18 165 C18 260 86 330 190 330 L190 270 C124 270 79 226 79 165 C79 104 124 60 190 60 Z"/>
      <path fill="#FFFFFF" d="M189 88 C139 88 105 119 105 165 C105 211 139 242 189 242 L189 206 C161 206 143 188 143 165 C143 142 161 124 189 124 Z"/>
      <path class="black" d="M105 145 H190 L161 116 L183 94 L250 165 L183 236 L161 214 L190 185 H105 Z"/>
      <path class="orange" d="M222 0 H300 L207 117 L250 161 L208 204 L300 330 H220 L160 248 L205 205 L160 160 L205 116 L160 72 Z"/>
    </g>
    <line x1="130" y1="24" x2="130" y2="116" class="thin-orange"/>
    <text x="160" y="66" font-size="34" class="title black">Clic</text>
    <text x="234" y="66" font-size="34" class="title orange">Konversion</text>
    <text x="160" y="96" font-size="11" class="caps black">STRATEGY · TECHNOLOGY · GROWTH</text>

    <!-- Dark -->
    <g transform="translate(0,165)">
      <rect width="500" height="140" rx="18" class="dark" filter="url(#shadow)"/>
      <g transform="translate(24,18) scale(.31)">
        <path fill="#FFFFFF" d="M190 0 C86 0 18 70 18 165 C18 260 86 330 190 330 L190 270 C124 270 79 226 79 165 C79 104 124 60 190 60 Z"/>
        <path class="dark" d="M189 88 C139 88 105 119 105 165 C105 211 139 242 189 242 L189 206 C161 206 143 188 143 165 C143 142 161 124 189 124 Z"/>
        <path fill="#FFFFFF" d="M105 145 H190 L161 116 L183 94 L250 165 L183 236 L161 214 L190 185 H105 Z"/>
        <path class="orange" d="M222 0 H300 L207 117 L250 161 L208 204 L300 330 H220 L160 248 L205 205 L160 160 L205 116 L160 72 Z"/>
      </g>
      <line x1="130" y1="24" x2="130" y2="116" class="thin-orange"/>
      <text x="160" y="66" font-size="34" class="title" fill="#FFFFFF">Clic</text>
      <text x="234" y="66" font-size="34" class="title orange">Konversion</text>
      <text x="160" y="96" font-size="11" class="caps" fill="#FFFFFF">STRATEGY · TECHNOLOGY · GROWTH</text>
    </g>
  </g>

  <!-- Divider above benefits -->
  <line x1="70" y1="935" x2="1530" y2="935" class="line"/>

  <!-- ================= BENEFITS ROW ================= -->
  <!-- Growth -->
  <g id="benefit-growth" transform="translate(80,980)">
    <g transform="translate(0,10)">
      <rect x="0" y="55" width="16" height="38" class="black"/>
      <rect x="24" y="38" width="16" height="55" class="black"/>
      <rect x="48" y="20" width="16" height="73" class="black"/>
      <path d="M0 34 L28 12 L46 20 L70 0" fill="none" stroke="#FF5A1F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M56 0 H70 V14" fill="none" stroke="#FF5A1F" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="95" y="34" font-size="22" class="title black">GROWTH</text>
    <text x="95" y="68" font-size="17" class="body black">Data-driven strategies</text>
    <text x="95" y="92" font-size="17" class="body black">that scale.</text>
  </g>

  <line x1="400" y1="970" x2="400" y2="1110" class="line"/>

  <!-- Conversion -->
  <g id="benefit-conversion" transform="translate(440,980)">
    <g transform="translate(0,12)">
      <path d="M65 18 A44 44 0 1 1 20 70" fill="none" stroke="#0B0D0F" stroke-width="10" stroke-linecap="round"/>
      <path d="M18 70 L7 50 L31 51 Z" class="black"/>
      <path d="M25 22 A44 44 0 0 1 72 74" fill="none" stroke="#FF5A1F" stroke-width="10" stroke-linecap="round"/>
      <path d="M74 74 L85 95 L61 94 Z" class="orange"/>
    </g>
    <text x="105" y="34" font-size="22" class="title black">CONVERSION</text>
    <text x="105" y="68" font-size="17" class="body black">Turning clicks into</text>
    <text x="105" y="92" font-size="17" class="body black">measurable results.</text>
  </g>

  <line x1="790" y1="970" x2="790" y2="1110" class="line"/>

  <!-- Technology -->
  <g id="benefit-technology" transform="translate(825,980)">
    <g transform="translate(0,4)">
      <circle cx="42" cy="50" r="8" class="orange"/>
      <circle cx="42" cy="10" r="7" class="black"/>
      <circle cx="42" cy="90" r="7" class="black"/>
      <circle cx="2" cy="50" r="7" class="black"/>
      <circle cx="82" cy="50" r="7" class="black"/>
      <circle cx="14" cy="18" r="7" class="orange"/>
      <circle cx="70" cy="18" r="7" class="orange"/>
      <circle cx="14" cy="82" r="7" class="orange"/>
      <circle cx="70" cy="82" r="7" class="orange"/>
      <g stroke="#0B0D0F" stroke-width="5">
        <line x1="42" y1="18" x2="42" y2="42"/>
        <line x1="42" y1="58" x2="42" y2="82"/>
        <line x1="10" y1="50" x2="34" y2="50"/>
        <line x1="50" y1="50" x2="74" y2="50"/>
        <line x1="19" y1="23" x2="36" y2="42"/>
        <line x1="65" y1="23" x2="48" y2="42"/>
        <line x1="19" y1="77" x2="36" y2="58"/>
        <line x1="65" y1="77" x2="48" y2="58"/>
      </g>
    </g>
    <text x="110" y="34" font-size="22" class="title black">TECHNOLOGY</text>
    <text x="110" y="68" font-size="17" class="body black">Intelligent systems</text>
    <text x="110" y="92" font-size="17" class="body black">that perform.</text>
  </g>

  <line x1="1195" y1="970" x2="1195" y2="1110" class="line"/>

  <!-- Strategy -->
  <g id="benefit-strategy" transform="translate(1230,980)">
    <g transform="translate(0,7)">
      <circle cx="46" cy="50" r="38" fill="none" stroke="#0B0D0F" stroke-width="7"/>
      <circle cx="46" cy="50" r="22" fill="none" stroke="#FF5A1F" stroke-width="7"/>
      <circle cx="46" cy="50" r="7" class="black"/>
      <path d="M46 50 L76 20" stroke="#0B0D0F" stroke-width="7" stroke-linecap="round"/>
      <path d="M71 15 L88 12 L85 29" fill="none" stroke="#FF5A1F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="110" y="34" font-size="22" class="title black">STRATEGY</text>
    <text x="110" y="68" font-size="17" class="body black">Focused plans.</text>
    <text x="110" y="92" font-size="17" class="body black">Smarter execution.</text>
  </g>
</svg>
